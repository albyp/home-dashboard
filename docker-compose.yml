name: home-dashboard

services:
  # Read-only view of the Docker API. Only container listing is allowed; every
  # write (POST/DELETE) is refused. Mounting docker.sock straight into the
  # dashboard would hand it root on the host, even with :ro.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: home-dashboard-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:2375:2375
    read_only: true
    tmpfs:
      - /run
    labels:
      dashboard.hide: "true"

  dashboard:
    build:
      context: .
      network: host
    image: home-dashboard:latest
    container_name: home-dashboard
    restart: unless-stopped
    depends_on:
      - socket-proxy
    # Host networking: it reads loopback-only services (Gatus, Syncthing, HA).
    # The server itself listens on 127.0.0.1 only; `tailscale serve` publishes it
    # as https://<host>.<tailnet>.ts.net (tailnet only).
    network_mode: host
    env_file: .env
    environment:
      - PORT=${PORT:-3001}
      - HOST=127.0.0.1
      - REDIRECT_PORT=3002
      - DASHBOARD_CONFIG=/app/dashboard.yaml
    # Non-root (uid 1000 can read the Syncthing config). As non-root,
    # tailscaled's LocalAPI only allows reading status.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # Edit dashboard.yaml and `docker compose restart` — no rebuild needed
      - ./dashboard.yaml:/app/dashboard.yaml:ro
      - /var/run/tailscale:/var/run/tailscale:ro
      - ${SYNCTHING_CONFIG_DIR:-/home/alby/.local/state/syncthing}:/syncthing:ro
      # This host's agent output (host-agent/health-check.sh)
      - /var/lib/home-dashboard:/agent:ro
      # Repos to compare with GitHub (read-only)
      - ${REPOS_DIR:-/home/alby/LocalGit}:/repos:ro
    labels:
      dashboard.hide: "true"
